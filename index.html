<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src wss: https:; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="description" content="Chat direto entre navegadores, sem servidor de mensagens.">
<title>Projeto Chat</title>
<link rel="stylesheet" href="style.css?v=7">
</head>
<body>

<main class="panel" id="panel" aria-label="Projeto Chat">
  <header class="topbar">
    <h1 id="whoami">Projeto Chat</h1>
    <div class="topbar-right">
      <span class="status" id="status">Iniciando...</span>
      <label class="lang">
        <span aria-hidden="true">🌐</span>
        <select id="lang" aria-label="Idioma / Language / Idioma">
          <option value="pt">Português</option>
          <option value="en">English</option>
          <option value="es">Español</option>
        </select>
      </label>
    </div>
  </header>

  <div class="body">
    <nav class="contacts">
      <h2 data-i18n="contacts">Contatos</h2>
      <p class="contacts-hint" data-i18n="tapHint">Toque em um contato para abrir a conversa.</p>
      <button class="add-btn" id="addBtn" data-i18n="addBtn">+ Entrar numa sala</button>
      <ul class="contact-list" id="contactList"></ul>
      <div class="rooms">
        <h2 data-i18n="rooms">Salas</h2>
        <ul class="room-list" id="roomList"></ul>
      </div>
      <button class="help-btn" id="helpBtn"><span class="q" aria-hidden="true">?</span><span data-i18n="help">Como usar</span></button>
    </nav>

    <section class="chat">
      <div class="chat-header">
        <button class="chat-back" id="backBtn"><span aria-hidden="true">←</span><span data-i18n="backLabel">Contatos</span></button>
        <div class="chat-title" id="chatTitle">Selecione um contato para conversar</div>
      </div>
      <div class="messages" id="messages">
        <p class="empty">Escolha um contato na lista para ver a conversa.</p>
      </div>
      <div class="composer">
        <button class="icon-btn" id="attachBtn" data-i18n-aria="attach" aria-label="Enviar imagem">📎</button>
        <input type="file" id="fileInput" accept="image/*" hidden>
        <input type="text" id="msgInput" data-i18n-placeholder="placeholder" placeholder="Digite uma mensagem..." autocomplete="off">
        <button class="send" id="sendBtn" data-i18n="send">Enviar</button>
      </div>
    </section>
  </div>
</main>

<div class="ctx" id="ctx"><button id="ctxDelete" data-i18n="deleteContact">Excluir contato</button></div>

<dialog class="help" id="helpDialog" aria-labelledby="helpTitle">
  <div class="help-head">
    <h2 id="helpTitle"></h2>
    <button class="help-close" id="helpClose" data-i18n-aria="close" aria-label="Fechar">✕</button>
  </div>
  <div class="help-body" id="helpBody"></div>
</dialog>

<script type="module" src="codigo.js?v=7"></script>
</body>
</html>
