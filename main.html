<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Chat direto entre navegadores, sem servidor de mensagens.">
<title>LAN Chat</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="panel" id="panel" aria-label="LAN Chat">
  <header class="topbar">
    <h1 id="whoami">Projeto Chat</h1><h5>por Gabriel Possani</h5>
    <div class="topbar-right">
      <span class="status" id="status">Iniciando...</span>
      <label class="lang">
        <span aria-hidden="true">🌐</span>
        <select id="lang" aria-label="Idioma / Language / Idioma">
          <option value="pt">Português</option>
          <option value="en">English</option>
          <option value="es">Español</option>
        </select>
      </label>
      <span class="idbox"><span data-i18n="idLabel">Seu ID:</span> <code id="myId"></code><button class="copy-btn" id="copyBtn" data-i18n="copy">Copiar</button></span>
    </div>
  </header>

  <div class="body">
    <nav class="contacts">
      <h2 data-i18n="contacts">Contatos</h2>
      <button class="add-btn" id="addBtn" data-i18n="addBtn">+ Conectar por ID</button>
      <ul class="contact-list" id="contactList"></ul>
      <button class="help-btn" id="helpBtn"><span class="q" aria-hidden="true">?</span><span data-i18n="help">Como usar</span></button>
    </nav>

    <section class="chat">
      <div class="chat-header" id="chatTitle">Selecione um contato para conversar</div>
      <div class="messages" id="messages">
        <p class="empty">Escolha um contato na lista para ver a conversa.</p>
      </div>
      <div class="composer">
        <button class="icon-btn" id="attachBtn" data-i18n-aria="attach" aria-label="Enviar imagem">📎</button>
        <input type="file" id="fileInput" accept="image/*" hidden>
        <input type="text" id="msgInput" data-i18n-placeholder="placeholder" placeholder="Digite uma mensagem..." autocomplete="off">
        <button class="send" id="sendBtn" data-i18n="send">Enviar</button>
      </div>
    </section>
  </div>
</main>

<div class="ctx" id="ctx"><button id="ctxDelete" data-i18n="deleteContact">Excluir contato</button></div>

<dialog class="help" id="helpDialog" aria-labelledby="helpTitle">
  <div class="help-head">
    <h2 id="helpTitle"></h2>
    <button class="help-close" id="helpClose" data-i18n-aria="close" aria-label="Fechar">✕</button>
  </div>
  <div class="help-body" id="helpBody"></div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="codigo.js"></script>
</body>
</html>
